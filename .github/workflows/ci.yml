name: CI

# Typecheck, tests, a real Metro bundle, and structural checks -- deliberately no deploy step,
# no Cloudflare/Expo credentials, no secrets of any kind. This project's real deploys
# (`pnpm bootstrap`, `eas build`) run from a developer's machine, per the README checklist.
on:
  # Every branch, not just main. Previously a feature branch with no open PR matched neither
  # trigger, so eight consecutive commits went unverified without anything saying so.
  push:
  pull_request:

# Cancel superseded runs on the same ref instead of letting them queue.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. action-setup errors out ("Multiple versions of pnpm
      # specified") when a version is pinned both here and as `packageManager` in package.json,
      # so package.json stays the single source of truth and CI cannot drift from local installs.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The same gate contributors run locally via `pnpm preflight`. Keeping CI and local on one
      # command is what stops them drifting -- preflight itself asserts it covers every `run:`
      # step in this file.
      - name: Typecheck workspace packages
        run: pnpm typecheck

      # scripts/** is not a pnpm workspace package (see scripts/tsconfig.json for why), so
      # `pnpm typecheck` above does not reach it. Check it explicitly instead.
      - name: Typecheck scripts/
        run: pnpm exec tsc --noEmit -p scripts/tsconfig.json

      - name: Test
        run: pnpm test

      # Metro must actually produce a bundle. Types and tests were green through four failed EAS
      # builds; only this step reflects whether the app can be built at all.
      - name: Bundle the app (Metro)
        run: pnpm --filter @astra/app exec expo export --platform ios --output-dir .ci-export

      # Structural checks that typecheck and tests cannot express: no contract value hardcoded,
      # no script name shadowed by a pnpm builtin, README commands exist, no credentials
      # committed, ownership unambiguous, child processes spawned without a shell.
      - name: Preflight structural checks
        run: pnpm preflight --structural-only
